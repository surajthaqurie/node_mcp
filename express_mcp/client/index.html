<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Chat Interface</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="chat-container">
      <header class="chat-header">
        <div class="logo">
          <span class="dot"></span>
          <h1>MCP Assistant</h1>
        </div>
        <div class="header-right">
          <div class="auth-summary">
            <div id="authStatus" class="auth-status">Guest Mode</div>
            <div id="usageStatus" class="usage-status"></div>
          </div>
          <button id="authBtn" class="auth-btn">Login</button>
        </div>
      </header>

      <div class="chat-history" id="chatHistory">
        <div class="message system">
          <div class="bubble">
            Welcome! Type <code>/command</code> or <code>/help</code> to list
            all available commands. Log in using the
            <strong>Login button</strong> above or type
            <code>/login admin@example.com password123</code> to access
            authenticated user features & user records.
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <form id="chatForm">
          <input
            type="text"
            id="messageInput"
            placeholder="Type a command or message..."
            autocomplete="off"
          />
          <button type="submit">
            <svg
              viewBox="0 0 24 24"
              width="24"
              height="24"
              stroke="currentColor"
              stroke-width="2"
              fill="none"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="send-icon"
            >
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </form>
      </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🔑 Login to MCP</h2>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <form id="loginForm">
          <div class="form-group">
            <label for="emailInput">Email</label>
            <input
              type="email"
              id="emailInput"
              value="admin@example.com"
              placeholder="admin@example.com"
              required
            />
          </div>
          <div class="form-group">
            <label for="passwordInput">Password</label>
            <input
              type="password"
              id="passwordInput"
              value="password123"
              placeholder="••••••••"
              required
            />
          </div>
          <div id="loginError" class="modal-error hidden"></div>
          <button type="submit" class="modal-submit-btn">
            Login & Authenticate
          </button>
        </form>
        <div class="modal-divider"><span>OR</span></div>
        <button id="quickDevLoginBtn" class="dev-login-btn">
          🚀 Quick Dev Demo Login
        </button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
